    if(ms.length>=2){
      const MP=[['casual','Soccar'],['rumble','Rumble'],['hoops','Hoops'],['drop','Dropshot'],['snow','Snow Day'],['heat','Heatseeker'],['big','Grand groupe']],c=P.cfg,mn=(MP.find(x=>x[0]===c.mode)||[0,c.mode])[1];
      const mine=ms.find(x=>x.id===me);
      h+='<h3>MATCH PRIVÉ</h3>';
      if(P.state==='match')h+='<div class="sub">⚽ Match en cours…</div>';
      else if(P.state==='queue')h+='<div class="sub">🔎 Recherche de match en cours pour tout le groupe…</div>';
      else{
        h+='<div class="sub">Ton équipe : <button class="opt" data-n="team:0" style="flex:none'+(mine&&mine.team===0?';outline:2px solid #6db0ff':'')+'">Bleu</button> <button class="opt" data-n="team:1" style="flex:none'+(mine&&mine.team===1?';outline:2px solid #ffb27a':'')+'">Orange</button></div>';
        if(lead){
          h+='<div style="display:flex;gap:8px;margin:8px 0"><select id="nMode" class="opt" style="flex:2">'+MP.map(x=>'<option value="'+x[0]+'"'+(x[0]===c.mode?' selected':'')+'>'+x[1]+'</option>').join('')+'</select><select id="nSize" class="opt" style="flex:1">'+(SZ[c.mode]||[2]).map(z=>'<option value="'+z+'"'+(z===c.size?' selected':'')+'>'+z+'v'+z+'</option>').join('')+'</select><select id="nDur" class="opt" style="flex:1">'+[3,5,10].map(d=>'<option value="'+d+'"'+(d===c.dur?' selected':'')+'>'+d+' min</option>').join('')+'</select></div>';
          h+='<button class="go" data-n="start">▶ LANCER LE MATCH PRIVÉ</button><div class="help">Les places vides sont remplies par des bots. Pour jouer contre d\'autres joueurs, lance une recherche depuis le menu Jouer : tout le groupe joue dans la même équipe.</div>';
        }else h+='<div class="sub">Mode : <b>'+esc(mn)+' '+c.size+'v'+c.size+'</b> • '+c.dur+' min — en attente du chef de groupe…</div>';
      }
    }
    /* --- demandes d'amis --- */
    if(fr&&fr.inc.length)h+='<h3>DEMANDES REÇUES ('+fr.inc.length+')</h3>'+fr.inc.map(f=>'<div class="frow"><div class="finfo"><b>'+esc(f.name)+'</b></div><button class="opt" data-n="acc:'+esc(f.uid)+'" style="flex:none">Accepter</button><button class="opt" data-n="dec:'+esc(f.uid)+'" style="flex:none">Refuser</button></div>').join('');
    if(fr&&fr.out.length)h+='<h3>DEMANDES ENVOYÉES</h3>'+fr.out.map(f=>'<div class="frow"><div class="finfo"><b>'+esc(f.name)+'</b> <small>en attente</small></div><button class="opt" data-n="can:'+esc(f.uid)+'" style="flex:none">Annuler</button></div>').join('');
    /* --- amis --- */
    const ord={online:0,party:1,queue:2,match:3,off:4},fl=fr?fr.friends.slice().sort((a,b)=>(ord[a.st]-ord[b.st])||a.name.localeCompare(b.name)):[],onl=fl.filter(f=>f.st!=='off').length;
    const LAB={online:'<span class="okk">En ligne</span>',party:'<small>En groupe</small>',queue:'<small>En recherche</small>',match:'<small>En match</small>',off:'<small>Hors ligne</small>'};
    h+='<h3>AMIS ('+onl+' en ligne)</h3><div id="nlist" style="max-height:30vh;overflow:auto">';
    if(!fl.length)h+='<div class="help">Aucun ami pour l\'instant. Donne ton code ami, ou entre celui d\'un ami ci-dessous.</div>';
    h+=fl.map(f=>{
      const inP=ms.some(x=>x.uid===f.uid),pend=!!P&&P.inv.some(x=>x.uid===f.uid);
      const can=(f.st==='online'||f.st==='party')&&!inP&&!pend&&!(P&&(P.state!=='lobby'||ms.length+P.inv.length>=4));
      return '<div class="frow"><div class="finfo"><b>'+esc(f.name)+'</b></div>'+LAB[f.st]+(inP?'<span class="okk">✔ Dans le groupe</span>':(pend?'<small>Invité…</small>':'<button class="opt" data-n="inv:'+esc(f.uid)+'" style="flex:none"'+(can?'':' disabled')+'>Inviter</button>'))+'<button class="opt" data-n="rm:'+esc(f.uid)+'" style="flex:none" title="Supprimer cet ami">🗑</button></div>';
    }).join('')+'</div>';
    h+='<div style="display:flex;gap:8px;margin:10px 0"><input id="nCode" maxlength="12" placeholder="CODE AMI" style="flex:1;min-width:0;box-sizing:border-box;padding:10px;border-radius:8px;border:1px solid #2a3a6a;background:#0b1330;color:#fff;font:inherit;text-transform:uppercase;letter-spacing:3px"><button class="opt" data-n="add" style="flex:none">Ajouter</button></div>';
    if(P)h+='<button class="go alt" data-n="leave">Quitter le groupe</button>';
    h+='<button class="go alt" data-a="mclose" id="nClose">Fermer</button>';
    modal(NET.frame(h));NET.pbind();
    const i=$('nCode');if(i&&keep){i.value=keep;if(foc)i.focus();}
    if($('nlist'))$('nlist').scrollTop=sc;
  },
  pbind(){
    const r=$('mbox').querySelector('#nroom');if(!r)return;
    r.onclick=e=>{const b=e.target.closest('[data-n]');if(!b||b.disabled)return;const s=b.dataset.n,k=s.indexOf(':');NET.pact(k<0?s:s.slice(0,k),k<0?'':s.slice(k+1));};
    const i=$('nCode');if(i)i.onkeydown=e=>{e.stopPropagation();if(e.key==='Enter')NET.pact('add','');};
    ['nMode','nSize','nDur'].forEach(id=>{const x=$(id);if(x)x.onchange=NET.pcfg;});
  },
  pcfg(){const m=$('nMode').value,L=SZ[m]||[2];let z=+$('nSize').value;if(L.indexOf(z)<0)z=L[Math.min(L.length-1,1)];NET.send({t:'p_cfg',mode:m,size:z,dur:+$('nDur').value});},
  pact(a,v){
    switch(a){
      case 'login':modalClose();GATE.show();break;
      case 'retry':NET.authSend();break;
      case 'copy':{const c=NET.acct.code;(navigator.clipboard?navigator.clipboard.writeText(c):Promise.reject()).then(()=>toast('Code copié !'),()=>{try{prompt('Ton code ami :',c);}catch(e){}});break;}
      case 'add':{const i=$('nCode'),c=i?i.value.trim():'';if(!c){toast('Entre le code ami de ton ami');return;}NET.send({t:'fr_add',code:c});if(i)i.value='';break;}
      case 'acc':NET.send({t:'fr_accept',uid:v});break;
      case 'dec':NET.send({t:'fr_decline',uid:v});break;
      case 'can':NET.send({t:'fr_cancel',uid:v});break;
      case 'rm':{const f=NET.fr&&NET.fr.friends.find(x=>x.uid===v);if(confirm('Supprimer '+(f?f.name:'cet ami')+' de ta liste d\'amis ?'))NET.send({t:'fr_remove',uid:v});break;}
      case 'inv':NET.send({t:'p_invite',uid:v});break;
      case 'kick':case 'promote':NET.send({t:'p_'+a,uid:v});break;
      case 'team':NET.send({t:'p_team',team:+v});break;
      case 'start':NET.send({t:'p_start'});break;
      case 'leave':NET.send({t:'p_leave'});break;
    }
  }
});

/* Compte connecté : on reste relié au serveur pour recevoir les invitations et voir la présence des amis. */
setInterval(()=>{if(CLOUD.user&&!NET.cp&&!NET.rcOn&&!NET.on&&(!NET.ws||NET.ws.readyState!==1))NET.connect();},12000);

/* Battement de cœur : un ping toutes les 3 s tant que la connexion est ouverte, quelle que soit la phase
   (file d'attente, salon, compte à rebours, but, replay, pause, résultats, onglet en arrière-plan).
   Avant, le ping n'était envoyé qu'en pleine action : le reste du temps la connexion restait muette et le serveur / le relais
   la coupait pour inactivité. Si le serveur ne répond plus depuis 20 s, on considère la connexion morte et on la ferme proprement. */
setInterval(()=>{
  const w=NET.ws;if(!w||w.readyState!==1)return;
  const now=performance.now();
  if(NET.gotPong&&NET.rx&&now-NET.rx>20000){NET.ws=null;try{w.close();}catch(e){}NET.gotPong=false;NET.dropped();return;}
  NET.send({t:'ping',ts:now});
},3000);
cfg.ballCam=SV.set.ballCam;cfg.autoThr=SV.set.autoThr;
{const mb=$('music');if(mb)mb.onclick=()=>{if(MUS.on){musNext();toast('♪ '+MUS.name);}};}
wallLoad();
toMenu();
NET.autoJoin();
requestAnimationFrame(frame);
/* PREMIER LANCEMENT : dès qu'un joueur ouvre le jeu pour la toute première fois (avant même la connexion), l'intro se joue.
   Le drapeau est gardé dans le navigateur, à part de la sauvegarde. Un joueur qui a déjà de la progression n'est pas un nouveau joueur : son drapeau est posé sans intro. */
setTimeout(()=>{
  const K='rocketArena3D.introSeen';let seen=false;
  try{seen=!!localStorage.getItem(K);}catch(e){}
  if(seen)return;
  try{localStorage.setItem(K,'1');}catch(e){}
  if(CLOUD.pristine(SV))introStart();
},400);
window.__rl={cfg:cfg,startMatch:startMatch,introStart:introStart,introEnd:introEnd,INTRO:INTRO,get cars(){return cars;},get ball(){return ball;},get player(){return player;},get phase(){return phase;},set phase(v){phase=v;},get scores(){return scores;},update:update,pads:pads,sdf:sdf,get timeLeft(){return timeLeft;},set timeLeft(v){timeLeft=v;},endReplay:endReplay,readPlayerInput:readPlayerInput,keys:keys,joy:joy,btn:btn,
  SV:()=>SV,go:go,toMenu:toMenu,MODE:MODE,MUT:MUT,HS:HS,DROP:DROP,HOOP:HOOP,TR:TR,MV:MV,MOVES:MOVES,mvLoad:mvLoad,mvBeginTry:mvBeginTry,mvSkip:mvSkip,IT:IT,LST:LST,owns:owns,buyItem:buyItem,openCrate:openCrate,doPlay:doPlay,lobby:lobby,configureMode:configureMode,matchRewards:matchRewards,givePower:givePower,PWK:PWK,
  get arena(){return {HX:HX,HZ:HZ,kind:ARN.kind};}};
})();
